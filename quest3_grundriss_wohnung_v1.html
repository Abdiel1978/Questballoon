<!--
  quest3_grundriss_wohnung_v1.html
  Version: 1.0
  WebXR VR - begehbare Wohnung aus Grundriss (Erdgeschoss, Haus-Hälfte mit "Garage vorhanden")
  Three.js r128 + WebXR
  Wände/Raumgrößen approximiert aus niedrig aufgelöstem Scan (Grundrisse_Haus_Westermeier)
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Grundriss Wohnung v1</title>
<style>
  body { margin: 0; overflow: hidden; background: #222; font-family: sans-serif; color: #fff; }
  #info { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #ccc; font-size: 13px; z-index: 10; }
  #startBtn {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border: 1px solid #fff; border-radius: 4px;
    background: rgba(0,0,0,0.6); color: #fff; font: 16px sans-serif; cursor: pointer; z-index: 20;
  }
</style>
</head>
<body>
<div id="info">Version 1.0 - Linker Thumbstick: Gehen | Rechter Thumbstick: Drehen | Trigger: Teleport</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, dolly, controller1, controller2;
let wallColliders = [];
let floorMeshes = [];
let teleportMarker;
let clock = new THREE.Clock();

const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8e0d0 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x99ccee, transparent: true, opacity: 0.25, roughness: 0.1 });
const floorHouseMat = new THREE.MeshStandardMaterial({ color: 0xc9a876 });
const floorGarageMat = new THREE.MeshStandardMaterial({ color: 0x999999 });
const floorTerrasseMat = new THREE.MeshStandardMaterial({ color: 0xd8cdb8 });

init();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x556677);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
  dolly = new THREE.Group();
  dolly.position.set(2.5, 0, -3); // Start vor der Wohnung, Richtung Eingang blickend
  dolly.add(camera);
  scene.add(dolly);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton());

  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  dolly.add(controller1);
  dolly.add(controller2);

  const rayGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-10)]);
  const rayLine1 = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: 0x00ffaa }));
  const rayLine2 = rayLine1.clone();
  controller1.add(rayLine1);
  controller2.add(rayLine2);

  teleportMarker = new THREE.Mesh(
    new THREE.RingGeometry(0.15, 0.2, 24),
    new THREE.MeshBasicMaterial({ color: 0x00ffaa, side: THREE.DoubleSide })
  );
  teleportMarker.rotation.x = -Math.PI / 2;
  teleportMarker.visible = false;
  scene.add(teleportMarker);

  buildApartment();

  window.addEventListener('resize', onResize);
  renderer.setAnimationLoop(render);
}

// ---- Wand-/Raum-Konstruktion ----

function addWallRun(x1, z1, x2, z2, openings = []) {
  const dx = x2 - x1, dz = z2 - z1;
  const length = Math.hypot(dx, dz);
  const angle = Math.atan2(dz, dx);
  const dirX = Math.cos(angle), dirZ = Math.sin(angle);
  const thickness = 0.15, wallHeight = 2.5;

  const sorted = openings.slice().sort((a, b) => a.start - b.start);
  let cursor = 0;
  const pieces = [];
  sorted.forEach(o => {
    if (o.start > cursor) pieces.push({ start: cursor, end: o.start, kind: 'solid' });
    pieces.push({ start: o.start, end: o.end, kind: o.type });
    cursor = o.end;
  });
  if (cursor < length) pieces.push({ start: cursor, end: length, kind: 'solid' });

  pieces.forEach(p => {
    const segLen = p.end - p.start;
    if (segLen <= 0.001) return;
    const midDist = p.start + segLen / 2;
    const mx = x1 + dirX * midDist, mz = z1 + dirZ * midDist;

    function placeBox(height, yCenter, mat) {
      const geo = new THREE.BoxGeometry(segLen, height, thickness);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(mx, yCenter, mz);
      mesh.rotation.y = -angle;
      scene.add(mesh);
    }

    if (p.kind === 'solid') {
      placeBox(wallHeight, wallHeight / 2, wallMat);
      wallColliders.push({ x1: x1 + dirX * p.start, z1: z1 + dirZ * p.start, x2: x1 + dirX * p.end, z2: z1 + dirZ * p.end, thickness });
    } else if (p.kind === 'door') {
      const doorH = 2.1;
      if (wallHeight > doorH) placeBox(wallHeight - doorH, doorH + (wallHeight - doorH) / 2, wallMat);
    } else if (p.kind === 'window') {
      const sill = 0.9, winTop = 2.1;
      placeBox(sill, sill / 2, wallMat);
      placeBox(wallHeight - winTop, winTop + (wallHeight - winTop) / 2, wallMat);
      placeBox(winTop - sill, sill + (winTop - sill) / 2, glassMat);
      wallColliders.push({ x1: x1 + dirX * p.start, z1: z1 + dirZ * p.start, x2: x1 + dirX * p.end, z2: z1 + dirZ * p.end, thickness });
    }
  });
}

function addFloor(x1, z1, x2, z2, mat) {
  const w = Math.abs(x2 - x1), d = Math.abs(z2 - z1);
  const geo = new THREE.PlaneGeometry(w, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set((x1 + x2) / 2, 0, (z1 + z2) / 2);
  scene.add(mesh);
  floorMeshes.push(mesh);
}

function addLabel(text, x, z) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = '#fff';
  ctx.font = '28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(text, 128, 42);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.2, 0.3, 1);
  sprite.position.set(x, 2.2, z);
  scene.add(sprite);
}

function buildApartment() {
  // Grundriss-Koordinaten (Meter). X = Breite, Z = Tiefe (Z=0 Eingang/Garage-Seite, Z steigt Richtung Terrasse)

  // --- Boden: Wohnung, Garage, Terrasse ---
  addFloor(0, 0, 5.6, 10.5, floorHouseMat);
  addFloor(-6.25, 0, 0, 4.0, floorGarageMat);
  addFloor(-0.2, 10.5, 5.8, 15.8, floorTerrasseMat);

  // --- Außenwände Wohnung ---
  // Westwand: Z0-4.0 = geteilte Wand zu Garage (Durchgang Neu = Tür), Z4.0-10.5 = Außenwand mit Fenster (Essen)
  addWallRun(0, 0, 0, 4.0, [{ start: 1.0, end: 2.2, type: 'door' }]);
  addWallRun(0, 4.0, 0, 10.5, [{ start: 1.0, end: 3.0, type: 'window' }]);

  // Ostwand: Fenster Richtung Küche/Wohnen
  addWallRun(5.6, 0, 5.6, 10.5, [
    { start: 1.0, end: 2.6, type: 'window' },
    { start: 6.5, end: 8.5, type: 'window' }
  ]);

  // Nordwand (Eingangsseite): Haustür + Küchenfenster
  addWallRun(0, 0, 5.6, 0, [
    { start: 0.6, end: 1.6, type: 'door' },
    { start: 3.6, end: 4.6, type: 'window' }
  ]);

  // Südwand (Terrassenseite): große Öffnung Wohnen -> Terrasse
  addWallRun(0, 10.5, 5.6, 10.5, [{ start: 0.4, end: 5.2, type: 'door' }]);

  // --- Innenwände ---
  // Diele/Küche Trennwand
  addWallRun(3.3, 0, 3.3, 3.9, [{ start: 0.5, end: 1.5, type: 'door' }]);
  // Diele/WC+Vorraum Trennwand
  addWallRun(2.2, 0, 2.2, 2.9, [{ start: 0.2, end: 1.2, type: 'door' }, { start: 1.7, end: 2.7, type: 'door' }]);
  // WC/Vorraum Trennwand
  addWallRun(2.2, 1.5, 3.3, 1.5, []);
  // Diele/Essen Trennwand
  addWallRun(0, 2.9, 2.2, 2.9, [{ start: 0.5, end: 1.7, type: 'door' }]);
  // Essen/Wohnen Trennwand (offen gestaltet)
  addWallRun(0, 6.5, 5.6, 6.5, [{ start: 1.0, end: 4.6, type: 'door' }]);

  // --- Garage ---
  addWallRun(-6.25, 0, -6.25, 4.0, [{ start: 1.0, end: 5.0, type: 'door' }]); // Garagentor
  addWallRun(-6.25, 0, 0, 0, []);
  addWallRun(-6.25, 4.0, 0, 4.0, []);

  // --- Terrassen-Geländer (nur Randmarkierung, kein Wanddurchgang) ---
  const railMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
  const rail = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.9, 0.05), railMat);
  rail.position.set(2.8, 0.45, 15.8);
  scene.add(rail);

  // --- Labels ---
  addLabel('Diele', 1.1, 1.4);
  addLabel('WC', 2.75, 0.7);
  addLabel('Vorraum', 2.75, 2.1);
  addLabel('Küche', 4.4, 1.9);
  addLabel('Essen', 1.6, 4.6);
  addLabel('Wohnen', 2.8, 8.5);
  addLabel('Terrasse', 2.8, 13.0);
  addLabel('Garage (vorhanden)', -3.1, 2.0);
}

// ---- Bewegung & Teleport ----

function getFlatDirection(quaternion) {
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(quaternion);
  dir.y = 0; dir.normalize();
  return dir;
}

function updateLocomotion(dt) {
  const session = renderer.xr.getSession();
  if (!session) return;

  let moveX = 0, moveY = 0, turnX = 0;
  for (const source of session.inputSources) {
    if (!source.gamepad) continue;
    const axes = source.gamepad.axes;
    const ax = axes.length >= 4 ? axes[2] : axes[0];
    const ay = axes.length >= 4 ? axes[3] : axes[1];
    if (source.handedness === 'left') { moveX = ax; moveY = ay; }
    else if (source.handedness === 'right') { turnX = ax; }
  }

  const speed = 1.6;
  const camQuat = new THREE.Quaternion();
  camera.getWorldQuaternion(camQuat);
  const forward = getFlatDirection(camQuat);
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).negate();

  const move = new THREE.Vector3();
  move.addScaledVector(forward, -moveY * speed * dt);
  move.addScaledVector(right, moveX * speed * dt);
  dolly.position.add(move);
  resolveCollisions();

  dolly.rotation.y -= turnX * 1.5 * dt;
}

function resolveCollisions() {
  const px = dolly.position.x, pz = dolly.position.z;
  const radius = 0.3;
  wallColliders.forEach(w => {
    const dx = w.x2 - w.x1, dz = w.z2 - w.z1;
    const len2 = dx * dx + dz * dz;
    let t = len2 > 0 ? ((px - w.x1) * dx + (pz - w.z1) * dz) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = w.x1 + t * dx, cz = w.z1 + t * dz;
    const distX = px - cx, distZ = pz - cz;
    const dist = Math.hypot(distX, distZ);
    const minDist = w.thickness / 2 + radius;
    if (dist < minDist && dist > 0.0001) {
      const push = (minDist - dist);
      dolly.position.x += (distX / dist) * push;
      dolly.position.z += (distZ / dist) * push;
    }
  });
}

function updateTeleport() {
  const session = renderer.xr.getSession();
  if (!session) { teleportMarker.visible = false; return; }

  let aimController = null, triggerPressed = false;
  for (const source of session.inputSources) {
    if (source.gamepad && source.gamepad.buttons[0] && source.gamepad.buttons[0].pressed) {
      triggerPressed = true;
      aimController = source.handedness === 'left' ? controller1 : controller2;
    }
  }

  if (triggerPressed && aimController) {
    const origin = new THREE.Vector3();
    const dir = new THREE.Vector3(0, 0, -1);
    aimController.getWorldPosition(origin);
    dir.applyQuaternion(aimController.getWorldQuaternion(new THREE.Quaternion()));
    const raycaster = new THREE.Raycaster(origin, dir);
    const hits = raycaster.intersectObjects(floorMeshes);
    if (hits.length > 0) {
      teleportMarker.visible = true;
      teleportMarker.position.copy(hits[0].point);
      teleportMarker.userData.pending = hits[0].point.clone();
    } else {
      teleportMarker.visible = false;
      teleportMarker.userData.pending = null;
    }
  } else {
    if (teleportMarker.userData.pending) {
      dolly.position.x = teleportMarker.userData.pending.x;
      dolly.position.z = teleportMarker.userData.pending.z;
      teleportMarker.userData.pending = null;
    }
    teleportMarker.visible = false;
  }
}

function render() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (renderer.xr.isPresenting) {
    updateLocomotion(dt);
    updateTeleport();
  }
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function VRButton() {
  const button = document.createElement('button');
  button.id = 'startBtn';
  if ('xr' in navigator) {
    navigator.xr.isSessionSupported('immersive-vr').then(supported => {
      button.textContent = supported ? 'VR STARTEN' : 'VR NICHT VERFÜGBAR';
      button.disabled = !supported;
    });
    button.onclick = () => {
      navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] })
        .then(session => renderer.xr.setSession(session));
    };
  } else {
    button.textContent = 'WEBXR NICHT UNTERSTÜTZT';
    button.disabled = true;
  }
  return button;
}
</script>
</body>
</html>
