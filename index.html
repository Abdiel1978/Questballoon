<!--
  quest3_ballonpop_v1.html
  Version: 1.0
  WebXR VR-Demo für Meta Quest 3 - Ballon-Pop
  Three.js r128 + WebXR
-->
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ballon-Pop VR v1</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
  #score { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 20px; z-index: 10; }
  #info { position: absolute; bottom: 10px; width: 100%; text-align: center; color: #aaa; font-size: 14px; z-index: 10; }
</style>
</head>
<body>
<div id="score">Punkte: 0</div>
<div id="info">Version 1.0</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, controller1, controller2;
let balloons = [];
let score = 0;
const scoreEl = document.getElementById('score');

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 50);

  const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  scene.add(light);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(1, 3, 2);
  scene.add(dirLight);

  // Boden
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(20, 20),
    new THREE.MeshStandardMaterial({ color: 0x3a5f3a })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton());

  // Controller
  controller1 = renderer.xr.getController(0);
  controller1.addEventListener('selectstart', onShoot);
  scene.add(controller1);

  controller2 = renderer.xr.getController(1);
  controller2.addEventListener('selectstart', onShoot);
  scene.add(controller2);

  const rayGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 0, -5)
  ]);
  const rayLine1 = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: 0xff0000 }));
  const rayLine2 = rayLine1.clone();
  controller1.add(rayLine1);
  controller2.add(rayLine2);

  for (let i = 0; i < 8; i++) spawnBalloon();

  window.addEventListener('resize', onResize);
  renderer.setAnimationLoop(render);
}

function spawnBalloon() {
  const colors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff];
  const geo = new THREE.SphereGeometry(0.25, 16, 16);
  const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)] });
  const balloon = new THREE.Mesh(geo, mat);
  const angle = Math.random() * Math.PI * 2;
  const radius = 2 + Math.random() * 2;
  balloon.position.set(Math.cos(angle)*radius, 1 + Math.random()*1.5, Math.sin(angle)*radius - 1);
  balloon.userData.floatOffset = Math.random() * Math.PI * 2;
  scene.add(balloon);
  balloons.push(balloon);
}

function onShoot(event) {
  const controller = event.target;
  const tempMatrix = new THREE.Matrix4();
  tempMatrix.identity().extractRotation(controller.matrixWorld);
  const raycaster = new THREE.Raycaster();
  raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

  const hits = raycaster.intersectObjects(balloons);
  if (hits.length > 0) {
    const hit = hits[0].object;
    scene.remove(hit);
    balloons = balloons.filter(b => b !== hit);
    score += 10;
    scoreEl.textContent = 'Punkte: ' + score;
    spawnBalloon();
  }
}

function render(time) {
  balloons.forEach(b => {
    b.position.y += Math.sin(time * 0.002 + b.userData.floatOffset) * 0.0015;
    b.rotation.y += 0.01;
  });
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Minimaler VRButton (inline statt externem Modul-Import)
function VRButton() {
  const button = document.createElement('button');
  Object.assign(button.style, {
    position: 'absolute', bottom: '20px', left: '50%', transform: 'translateX(-50%)',
    padding: '12px 24px', border: '1px solid #fff', borderRadius: '4px',
    background: 'rgba(0,0,0,0.6)', color: '#fff', font: '16px sans-serif',
    cursor: 'pointer', zIndex: 999
  });

  if ('xr' in navigator) {
    navigator.xr.isSessionSupported('immersive-vr').then(supported => {
      button.textContent = supported ? 'VR STARTEN' : 'VR NICHT VERFÜGBAR';
      button.disabled = !supported;
    });
    button.onclick = () => {
      navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] })
        .then(session => renderer.xr.setSession(session));
    };
  } else {
    button.textContent = 'WEBXR NICHT UNTERSTÜTZT';
    button.disabled = true;
  }
  return button;
}
</script>
</body>
</html>
